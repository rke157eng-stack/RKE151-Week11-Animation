<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Lab · Veebidisaini alused</title><style>
:root{font-family:Inter,'Segoe UI',Arial,sans-serif;--ink:#25203c;--muted:#77718d;--purple:#7650e8;--deep:#5130b7;--line:#e7e1f3;--soft:#f1ebff;--green:#147e61}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 5%,#f4dff7,transparent 40%),radial-gradient(ellipse at 0 0,#e9e0ff,transparent 44%),#f9f7fe;color:var(--ink)}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #c5b2ff;outline-offset:3px}.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:#ffffffdd;border-right:1px solid var(--line);padding:27px 17px}.brand{display:flex;align-items:center;gap:11px;margin-bottom:27px;font-size:21px;font-weight:850;letter-spacing:-.7px}.brandicon{background:linear-gradient(145deg,#ad8dff,#6843d7);color:white;width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:24px}.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:3px}.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#746c87;width:100%;text-align:left;padding:10px;border-radius:12px;margin:3px 0;font-size:13px}.nav:hover{background:#f5f1ff}.nav.active{background:#eee7ff;color:var(--deep);font-weight:750}.nav.done{color:var(--green)}.num{width:27px;height:27px;display:grid;place-items:center;flex-shrink:0;background:#f1edf8;border-radius:9px;font-weight:800;font-size:12px}.nav.active .num{background:var(--purple);color:white}.nav.done .num{background:#e1f5ec}.progresscard{margin-top:25px;border:1px solid var(--line);border-radius:15px;background:#faf8ff;padding:15px;font-size:13px}.bar{height:8px;background:#e7ddfa;border-radius:10px;overflow:hidden;margin-top:12px}.bar span{height:100%;display:block;background:linear-gradient(90deg,#9873f3,#6d44df);transition:width .3s}.main{width:100%;max-width:1100px;padding:38px 50px 70px;margin:0 auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:2px;color:var(--purple)}.pill{font-size:12px;border:1px solid var(--line);border-radius:30px;background:white;padding:9px 14px;font-weight:750;color:var(--deep)}h1{font-size:clamp(32px,4vw,48px);line-height:1.1;letter-spacing:-1.8px;margin:20px 0 12px}h2{font-size:24px;margin:0 0 12px;letter-spacing:-.5px}h3{font-size:17px;margin:0 0 12px}p{line-height:1.7}.lead{color:var(--muted);max-width:760px;margin-bottom:25px}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:27px;box-shadow:0 14px 40px #4b2d870b}.stage{background:radial-gradient(circle at 90% 10%,#e6d9ff,transparent 50%),linear-gradient(130deg,#fbfaff,#f1eafd);border-radius:19px;min-height:255px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:20px;padding:25px;position:relative;overflow:hidden}.controls{display:flex;align-items:end;flex-wrap:wrap;gap:12px;margin:19px 0}.field{display:grid;gap:6px;font-size:12px;font-weight:750}.field select,.field input{border:1px solid var(--line);border-radius:11px;background:white;padding:11px;color:var(--ink);min-width:145px}.field input[type=range]{accent-color:var(--purple);padding:8px}.btn{background:var(--purple);color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:750;transition:transform .22s,box-shadow .22s,background .22s}.btn:hover{background:var(--deep);transform:translateY(-2px);box-shadow:0 8px 22px #7650e83a}.btn.secondary{background:#ede6ff;color:#5130b7}.btn.secondary:hover{background:#ddd0ff}.btn.outline{background:white;color:var(--deep);border:1px solid #cbb9ff}.btn.text{background:transparent;color:var(--deep);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}.theory{background:#f4efff;border-left:4px solid #7951ee;border-radius:12px;padding:17px 19px;margin:18px 0}.theory strong{color:#5930c7}.theory p{margin:7px 0 0}.quiz{border-top:1px solid var(--line);margin-top:24px;padding-top:22px}.options{display:grid;gap:9px;margin-top:15px}.option{text-align:left;border:1px solid var(--line);background:white;padding:14px 16px;border-radius:12px;color:var(--ink)}.option:hover{border-color:#a58bf4;background:#faf8ff}.option.chosen{border:2px solid var(--purple);background:#f5f0ff}.feedback{border-radius:12px;padding:14px;margin-top:13px;line-height:1.6}.feedback.good{background:#e4f7ed;color:#11674e}.feedback.bad{background:#fff0f3;color:#9d3451}.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:23px}.coffee{background:white;border-radius:18px;width:215px;padding:14px;box-shadow:0 12px 35px #5130b71c;transition:transform .3s,box-shadow .3s}.coffee-art{height:112px;background:linear-gradient(140deg,#f5e1cb,#e6c4a1);border-radius:12px;display:grid;place-items:center;font-size:64px}.coffee h3{margin:12px 0 3px}.coffee p{font-size:13px;color:var(--muted);margin:0 0 10px}.coffee:hover{box-shadow:0 18px 38px #5130b72a}.tile{width:90px;height:90px;border-radius:24px;background:linear-gradient(135deg,#bca6ff,#7650e8);box-shadow:0 13px 30px #7954e84a}.mock{background:white;padding:17px;border-radius:16px;box-shadow:0 10px 25px #5130b71a;width:min(100%,510px)}.mockhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.mocknav{display:flex;gap:8px;flex-wrap:wrap}.mocknav button,.menuitem{border:0;background:transparent;border-radius:9px;padding:10px;color:var(--ink)}.mocknav button:hover,.menuitem:hover{background:#eee6ff}.menupanel{background:#f3eeff;border-radius:11px;padding:10px;margin-top:12px}.menupanel .menuitem{display:block;width:100%;text-align:left}.notice{position:absolute;bottom:14px;right:15px;background:white;box-shadow:0 10px 24px #5130b72b;border-radius:12px;padding:12px 16px;animation:appear .3s ease-out}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%}.mini{background:white;border:1px solid #e9e1f5;border-radius:16px;padding:20px;text-align:center}.mini p{font-size:13px;color:var(--muted);margin:5px 0}.device{display:flex;gap:9px;background:#fff;padding:6px;border-radius:14px}.device button{border:0;background:transparent;border-radius:10px;padding:11px 16px;color:var(--muted);font-weight:750}.device button.active{background:#eee7ff;color:var(--deep)}.caption{font-size:13px;color:var(--muted);text-align:center;width:100%}.introgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.purpose{padding:17px;background:#faf8ff;border:1px solid var(--line);border-radius:15px}.purpose strong{display:block;margin-bottom:5px}.purpose p{margin:0;font-size:13px;color:#655e79}.end{padding:35px;text-align:center}.code{font-size:32px;letter-spacing:4px;font-weight:900;color:var(--deep);background:#ede6ff;padding:19px 30px;border-radius:15px;display:inline-block;margin:12px}.toggle{display:flex;align-items:center;gap:9px;font-size:13px}.toggle input{accent-color:var(--purple)}@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes slide{from{opacity:0;transform:translateX(-75px)}to{opacity:1;transform:translateX(0)}}@keyframes scale{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}@keyframes bounce{50%{transform:translateY(-35px)}}@keyframes pulse{50%{transform:scale(1.15)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:14px}.brand{margin-bottom:12px}.navlist{display:flex;overflow:auto}.nav{min-width:160px}.progresscard{display:none}.main{padding:24px 16px}.panel{padding:18px}.two,.introgrid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brandicon">✦</div><div>Motion Lab<small>Veebidisaini alused · Osa 11</small></div></div><div class="navlist" id="nav"></div><div class="progresscard"><strong>Sinu edusammud</strong><p id="progressText">0 / 12</p><div class="bar"><span id="progressBar"></span></div></div></aside><main class="main"><div class="topline"><span class="eyebrow">INTERAKTIIVNE ÕPPELABOR</span><span class="pill" id="counter"></span></div><h1 id="title"></h1><p class="lead" id="desc"></p><section class="panel" id="panel"><h2 id="task"></h2><p id="instructions"></p><div class="stage" id="stage"></div><div class="controls" id="controls"></div><div class="theory" id="theory"></div><div class="quiz"><h3>🧠 Kontrolli oma teadmisi</h3><p id="question"></p><div class="options" id="options"></div><button class="btn" id="check">Kontrolli vastust</button><div id="feedback"></div></div></section><div class="foot" id="foot"><button class="btn outline" id="prev">← Eelmine</button><button class="btn" id="next">Järgmine →</button></div></main></div><script>
const labs=[
{short:'Sissejuhatus',title:'Miks veebilehed liiguvad?',desc:'Avasta, mis on animatsioon ja miks seda veebidisainis kasutatakse.',task:'Animatsioonil on eesmärk',instructions:'Uuri nelja kasutusjuhtu ja vajuta näidisnuppu. Millist infot annab liikumine kasutajale?',theory:'Animatsioon on visuaalne muutus, mis toimub aja jooksul. See võib muuta värvi, asukohta, suurust või läbipaistvust. Veebidisainis kasutatakse animatsioone eelkõige tagasiside andmiseks, tähelepanu suunamiseks, seoste selgitamiseks ja ootamise mõistetavaks muutmiseks. Animatsioon ei ole eesmärk omaette.',q:'Milline on hea animatsiooni kõige olulisem omadus?',a:['See liigub võimalikult palju','See aitab kasutajal toimuvat mõista','See muudab kõik elemendid värviliseks'],correct:1,why:'Õige! Hea animatsioon toetab kasutaja tegevust ja arusaamist.'},
{short:'Hover-efektid',title:'Mis juhtub hiirekursori all?',desc:'Hover-efekt on reaktsioon kursori liikumisele elemendi kohale.',task:'Hover-efektide stuudio',instructions:'Liiguta kursor nupule ja kaardile. Vali värvi, suuruse, varju või nihke efekt ning võrdle tulemusi.',theory:'Hover on elemendi olek siis, kui osutusseade, näiteks hiirekursor, asub selle kohal. Hover aitab märgata, et element on interaktiivne. CSS-is kasutatakse selleks sageli :hover ja transition. Oluline tegevus ei tohi sõltuda ainult hover-efektist.',q:'Millal tekib tavaline hover-olek?',a:['Kui hiirekursor liigub elemendi kohale','Ainult siis, kui kasutaja vajutab Enter','Alati, kui veebileht laadib'],correct:0,why:'Õige! Hover sõltub tavaliselt kursori asukohast, mitte klõpsust.'},
{short:'Puuteekraanid',title:'Aga mis saab telefonis?',desc:'Puuteekraanil ei saa loota hiirekursori hõljumisele.',task:'Paranda puuteekraani menüü',instructions:'Proovi kõigepealt vigast menüüd arvutirežiimis ja seejärel telefonirežiimis. Paranda menüü nii, et seda saaks avada puudutusega.',theory:'Telefonidel ja tahvelarvutitel ei pruugi olla hover-olekut. Mõni brauser võib hover-efekti puudutamisel jäljendada, kuid see pole usaldusväärne viis oluliste tegevuste näitamiseks. Menüü peab avanema puudutuse või klõpsuga ning selle juhtnupp peab olema nähtav. Arvesta ka klaviatuuri fookusega.',q:'Miks ei tohi oluline menüü avaneda ainult hover-efektiga?',a:['Sest kõik telefonid kasutavad hiirt','Sest puuteekraanil ei saa hover-olekule kindlalt toetuda','Sest mobiilis ei saa menüüsid kasutada'],correct:1,why:'Õige! Olulised tegevused peavad töötama ka puudutuse ja klaviatuuriga.'},
{short:'Mikrointeraktsioonid',title:'Nupp, mis vastab',desc:'Väikesed reaktsioonid annavad kasutajale märku, et tema tegevust märgati.',task:'Anna nupule tagasiside',instructions:'Vali nupu reaktsioon ja klõpsa. Võrdle värvimuutust, suurenemist, raputamist ja tagasiside puudumist.',theory:'Mikrointeraktsioon on väike kasutaja tegevusele või süsteemi olekule reageeriv muutus. Näiteks nupu olekuvahetus, lemmikuks märkimine või lühike kinnitusteade. See peab olema selge, kiire ja eesmärgipärane.',q:'Milleks kasutatakse mikrointeraktsioone?',a:['Et anda tegevuse kohta tagasisidet','Et asendada kogu lehe sisu','Et peita kõik olulised nupud'],correct:0,why:'Just! Mikrointeraktsioon annab kasutajale mõistetavat tagasisidet.'},
{short:'Kestus ja easing',title:'Liiga kiire või liiga aeglane?',desc:'Animatsiooni kestus ja kiiruse muutumine mõjutavad liikumise tunnetust.',task:'Liikumise juhtpult',instructions:'Muuda kestust vahemikus 50–2000 ms, vali easing ja käivita sama liikumine mitu korda.',theory:'Duration on animatsiooni kestus millisekundites. Easing määrab, kuidas liikumise kiirus ajas muutub. Linear liigub ühtlaselt, Ease In kiireneb alguses, Ease Out aeglustub lõpus ja Ease In Out ühendab mõlemad. Sobiv kestus sõltub liikumise eesmärgist ja ulatusest.',q:'Mida tähendab Ease Out?',a:['Liikumine aeglustub lõpus','Liikumine on kogu aeg sama kiire','Element kaob kohe'],correct:0,why:'Õige! Ease Out muudab liikumise lõpu pehmemaks.'},
{short:'Tagasiside',title:'Kas ost õnnestus?',desc:'Pärast kasutaja tegevust peab olema selge, mis juhtus.',task:'Ostukorvi tagasiside',instructions:'Lisa kohv ostukorvi nii nähtava kinnitusega kui ka ilma. Võrdle, kummal juhul saad tulemusest paremini aru.',theory:'Süsteemi oleku nähtavus on kasutajakogemuse oluline põhimõte. Pärast ostukorvi lisamist võib muutuda nupu tekst, ostukorvi loendur või ilmuda kinnitusteade. Liikumine võib seda tagasisidet toetada, kuid sõnum peab olema arusaadav ka ilma liikumiseta.',q:'Milline lahendus annab kõige selgema kinnituse?',a:['Mitte midagi ei muutu','Leht vilgub ilma selgituseta','Nupp ja ostukorvi loendur näitavad tulemust'],correct:2,why:'Õige! Kasutaja saab aru, et tegevus õnnestus.'},
{short:'Menüü liikumine',title:'Kust menüü välja ilmub?',desc:'Liikumine võib aidata mõista menüü asukohta ja seost avamisnupuga.',task:'Menüü avamise katse',instructions:'Ava ja sulge menüü erinevate animatsioonidega. Võrdle kohest ilmumist, hajumist ja külje pealt sisenemist.',theory:'Menüü animatsioon võib selgitada, kust uus paneel tuli ja kuhu see sulgemisel kaob. Liikumine peaks olema lühike ja järjepidev. Avamis- ja sulgemisnupp peavad töötama ka ilma animatsioonita.',q:'Miks võib menüü sujuv avamine olla kasulik?',a:['See selgitab elementide omavahelisi seoseid','See kiirendab automaatselt internetti','See asendab menüü sisu'],correct:0,why:'Õige! Liikumine aitab kasutajal ruumilisi seoseid mõista.'},
{short:'Liikumise eesmärk',title:'Animatsioonide katastroof',desc:'Kui kõik liigub korraga, muutub oluline info raskemini märgatavaks.',task:'Taltsuta liikuvat lehte',instructions:'Proovi pöörlemist, hüppamist, pulseerimist ja raputamist. Seejärel peata liigne liikumine.',theory:'Animatsioon peaks aitama, mitte tähelepanu hajutama. Pidevalt liikuvad dekoratsioonid võivad segada lugemist ja tekitada ebamugavust. Eelista eesmärgipärast liikumist ja jäta kasutajale kontroll.',q:'Millal on animatsioon põhjendatud?',a:['Alati, kui võimalik','Kui see toetab tegevust või arusaamist','Kui kõik elemendid liiguvad korraga'],correct:1,why:'Õige! Liikumine peab teenima kasutaja eesmärki.'},
{short:'Ligipääsetavus',title:'Kõik ei armasta liikumist',desc:'Mõne inimese jaoks võib tugev liikumine olla ebamugav.',task:'Vähendatud liikumise režiim',instructions:'Lülita vähendatud liikumine sisse ja välja. Käivita sama tegevus mõlemas režiimis.',theory:'Prefers-reduced-motion võimaldab veebilehel arvestada kasutaja süsteemiseadistusega. Vähendatud liikumise puhul võib asendada suure liikumise lihtsa oleku- või värvimuutusega. Oluline tagasiside peab säilima. Ka klaviatuuri fookus peab olema nähtav.',q:'Mida teha, kui kasutaja eelistab vähendatud liikumist?',a:['Peita nupud','Säilitada tagasiside ja vähendada liikumist','Keelata veebilehe kasutamine'],correct:1,why:'Õige! Ligipääsetavus tähendab, et kasutaja saab endiselt kõigest aru.'},
{short:'Ilmumisefektid',title:'Kuidas element ekraanile ilmub?',desc:'Fade In, Slide In ja Scale In loovad erineva mulje.',task:'Katseta ilmumisanimatsioone',instructions:'Vali ilmumisefekt ja käivita animatsioon. Võrdle seda kohese ilmumisega.',theory:'Fade In muudab elemendi järk-järgult nähtavaks. Slide In lisab liikumise kindlast suunast. Scale In muudab elemendi suurust. Ilmumisanimatsioon võib juhtida tähelepanu uuele sisule, kuid ei tohiks segada lugemist ega peita olulist infot.',q:'Milline efekt muudab ainult läbipaistvust?',a:['Slide In','Fade In','Scale In'],correct:1,why:'Õige! Fade In ei pea muutma elemendi asukohta ega suurust.'},
{short:'Nuppude tüübid',title:'Nuppude disainistuudio',desc:'Nuppude visuaalne hierarhia aitab olulisi tegevusi eristada.',task:'Katseta nuppe ja olekuid',instructions:'Vajuta Primary, Secondary, Text ja Icon nuppu. Proovi ka Disabled-olekut ning liigu Tab-klahviga nuppude vahel.',theory:'Primary-nupp tähistab tavaliselt kõige olulisemat tegevust. Secondary toetab seda. Text-nupp on väiksema visuaalse rõhuga. Icon-nupp vajab arusaadavat ikooni ja ligipääsetavat nime. Hover, Focus, Active ja Disabled on erinevad olekud: fookus peab olema nähtav ka klaviatuuriga.',q:'Milline nupp sobib tavaliselt peamiseks tegevuseks?',a:['Primary','Text','Kõik nupud peavad olema ühesugused'],correct:0,why:'Õige! Primary-nupp aitab tähtsaima tegevuse esile tõsta.'},
{short:'Menüüde tüübid',title:'Menüüde disainistuudio',desc:'Erinevad ekraanid ja sisustruktuurid vajavad erinevat navigatsiooni.',task:'Katseta nelja menüütüüpi',instructions:'Vali horisontaalne menüü, rippmenüü, külgmenüü või hamburger-menüü. Ava valikud ja proovi neid.',theory:'Horisontaalne menüü sobib sageli suurele ekraanile. Rippmenüü koondab seotud valikuid. Külgmenüü sobib mahukamale navigatsioonile. Hamburger-menüü säästab ruumi, kuid peidab valikud, mistõttu tuleb pöörata tähelepanu nende leitavusele. Kõik menüüd peavad töötama puudutuse ja klaviatuuriga.',q:'Milline menüü võib väiksel ekraanil ruumi säästa?',a:['Väga lai horisontaalne menüü','Hamburger-menüü','Menüü täielik eemaldamine'],correct:1,why:'Õige! Hamburger-menüü säästab ruumi, kuid valikud tuleb teha hõlpsasti leitavaks.'}
];
const $=id=>document.getElementById(id);let index=0,done=new Set(),selected=-1,explored=false,feedback='',cleanup=null;try{const s=JSON.parse(localStorage.getItem('motionlab-v4')||'{}');index=Math.max(0,Math.min(labs.length,Number(s.index)||0));done=new Set((s.done||[]).filter(i=>Number.isInteger(i)&&i>=0&&i<labs.length))}catch(e){}function save(){try{localStorage.setItem('motionlab-v4',JSON.stringify({index,done:[...done]}))}catch(e){}}function mark(){explored=true}function notify(msg){const old=document.querySelector('.notice');if(old)old.remove();const n=document.createElement('div');n.className='notice';n.textContent=msg;$('stage').append(n);setTimeout(()=>n.remove(),1700)}function field(label,values,cb){const l=document.createElement('label');l.className='field';l.textContent=label;const s=document.createElement('select');values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.append(o)});s.onchange=()=>{mark();cb(s.value)};l.append(s);$('controls').append(l);return s}function button(text,cb,kind='secondary'){const b=document.createElement('button');b.className='btn '+kind;b.textContent=text;b.onclick=()=>{mark();cb()};$('controls').append(b);return b}function setStage(html){$('stage').innerHTML=html}function nav(){ $('nav').innerHTML='';labs.forEach((l,i)=>{const b=document.createElement('button');b.className='nav '+(i===index?'active ':'')+(done.has(i)?'done':'');b.innerHTML='<span class="num">'+(done.has(i)?'✓':i===0?'✦':i)+'</span><span>'+l.short+'</span>';b.onclick=()=>go(i);$('nav').append(b)});$('progressText').textContent=done.size+' / '+labs.length+' osa läbitud';$('progressBar').style.width=(done.size/labs.length*100)+'%'}function go(i){if(i<0||i>labs.length)return;if(cleanup){cleanup();cleanup=null}index=i;selected=-1;explored=false;feedback='';save();render();window.scrollTo({top:0,behavior:'smooth'})}function render(){nav();if(index===labs.length){$('counter').textContent='VALMIS';$('title').textContent='Oled liikumismeister!';$('desc').textContent='Kõik Motion Labi osad on läbitud.';$('panel').innerHTML='<div class="end"><div style="font-size:72px">🏆</div><h2>Suurepärane töö!</h2><p>Oled õppinud animatsioonide eesmärke, hover-efekte, puuteekraanide eripära, mikrointeraktsioone, ligipääsetavust ning nuppude ja menüüde tüüpe.</p><p>Sinu Moodle’i koodsõna:</p><div class="code">LIIKUMINE</div><p>Sisesta koodsõna Moodle’i ülesandesse.</p><button class="btn" id="copycode">Kopeeri koodsõna</button></div>';$('copycode').onclick=()=>{navigator.clipboard?.writeText('LIIKUMINE').then(()=>{$('copycode').textContent='Kopeeritud ✓'}).catch(()=>{$('copycode').textContent='LIIKUMINE'})};$('foot').innerHTML='<button class="btn outline" onclick="location.reload()">Vaata laboreid uuesti</button>';return}const l=labs[index];$('counter').textContent=index===0?'SISSEJUHATUS':`LAB ${String(index).padStart(2,'0')} / 11`;$('title').textContent=l.title;$('desc').textContent=l.desc;$('task').textContent=l.task;$('instructions').textContent=l.instructions;$('theory').innerHTML='<strong>✦ Avasta põhimõte</strong><p>'+l.theory+'</p>';$('question').textContent=l.q;$('options').innerHTML='';l.a.forEach((a,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+a;b.onclick=()=>{selected=i;document.querySelectorAll('.option').forEach((o,j)=>o.classList.toggle('chosen',j===i))};$('options').append(b)});$('feedback').innerHTML=done.has(index)?'<div class="feedback good">✓ See osa on juba läbitud. Võid katseid korrata.</div>':'';$('check').onclick=()=>{if(selected<0){$('feedback').innerHTML='<div class="feedback bad">Vali kõigepealt vastus.</div>';return}if(!explored&&!done.has(index)){$('feedback').innerHTML='<div class="feedback bad">Enne vastamist tee vähemalt üks katse.</div>';return}if(selected===l.correct){done.add(index);save();nav();$('next').disabled=false;$('feedback').innerHTML='<div class="feedback good">✓ '+l.why+'</div>'}else $('feedback').inne
